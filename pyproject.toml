[project]
name = "devmate"
version = "0.1.0"
description = "Autonomous RAG-powered coding agent CLI"
authors = [
    {name = "SudeepKagi", email = "sudeepskagi@gmail.com"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=13.6.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    "langchain-xai (>=1.3.0,<2.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "langchain-openai (>=1.1.7,<2.0.0)",
    "tree-sitter (>=0.21.3)",
    "tree-sitter-languages (>=1.10.2) ; python_version < \"3.13\"",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "sentence-transformers (>=3.0.0)",
    "qdrant-client (>=1.10.0)",
    "langchain-qdrant (>=1.1.0)",
    "langchain-groq (>=1.1.0)",
    "fastembed (>=0.8.0,<0.10.0)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=5.0.0,<9.0.0)",
    "redisvl (>=0.23.0,<0.29.0) ; python_version < \"3.15\""
]

[project.scripts]
devmate = "devmate.main:run"

[tool.poetry]
packages = [
    {include = "devmate"}
]

[tool.poetry.scripts]
devmate = "devmate.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "deepeval (>=4.0.7,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
