[project]
name = "devmate"
version = "0.1.0"
description = ""
authors = [
    {name = "SudeepKagi", email = "sudeepskagi@gmail.com"}
]
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    "langchain-xai (>=1.3.0,<2.0.0)",
    "langchain-huggingface (>=1.2.3,<2.0.0)",
    "langchain-openai (>=1.1.7,<2.0.0)",
    "tree-sitter (>=0.26.0,<0.27.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "sentence-transformers (>=3.0.0)"
]

[tool.poetry]
packages = [{include = "devmate"}]

[tool.poetry.scripts]
devmate = "devmate.main:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
