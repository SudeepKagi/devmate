llm:
  provider: openai
  model: gpt-4o-mini
  judge_model: gpt-4o-mini   # low-cost model used for LLM-as-judge

embeddings:
  provider: openai
  model: text-embedding-3-small
  dims: 1536

vector_store:
  provider: chroma
  retrieval_mode: dense

chromadb:
  persist_dir: .devmate/chromadb/
  collection_name: codebase

tasks:
  db_path: .devmate/tasks.db

semantic_cache:
  enabled: true
  redis_url: redis://localhost:6379
  threshold: 0.85
  ttl: 86400

prompt_caching:
  enabled: false

router:
  enabled: false
  fast_model: gpt-4o-mini
  strong_model: gpt-4o

retrieval:
  mode: dense   # dense | hybrid

chunking:
  mode: ast     # file | ast

sandbox:
  enabled: false
  timeout_seconds: 30
  network: false

skills:
  skills_dir: .devmate/skills

memory:
  db_path: .devmate/memory/memory.db
  summarize_at_tokens: 4000
  keep_last_messages: 20

rag:
  mode: semantic

qdrant:
  collection_name: devmate