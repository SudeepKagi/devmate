llm:
  provider: openai    # openai | gemini | grok
  model: gpt-4o-mini
  max_tokens: 1000

embeddings:
  provider: openai    # openai | gemini | huggingface
  model: text-embedding-3-small

chromadb:
  persist_dir: .chromadb/
  collection_name: codebase

elasticsearch:
  url: http://localhost:9200
  index_name: codebase